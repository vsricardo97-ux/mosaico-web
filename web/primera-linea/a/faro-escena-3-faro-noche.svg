<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- El Faro, escena de la etapa 3 "Faro de noche" (Chipiona, noche de verano), de Inés (r3, con el visto bueno de Carmen). Va DETRÁS de la torre de Mateo (skin faro-noche) en la ficha de la Caseta y en la tarjeta de compartir; el horizonte está en y=86 y la linterna en (50,31), como en la skin. Sangre de -30 a 130 por los cuatro lados para recortar en vertical con la prop viewBox. Capas de atrás adelante: cielo, lejanía, agua, arena, primer plano. -->
